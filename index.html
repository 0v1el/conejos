<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adopción de Conejitos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>¡Encuentra a tu nuevo mejor amigo! 🐰</h1>
        <p>Conoce a nuestros hermosos conejitos esperando un hogar.</p>
    </header>

    <!-- Contenedor donde se insertarán las tarjetas -->
    <main id="tienda-contenedor" class="contenedor"></main>

    <!-- ver la galería de fotos -->
    <div id="modal-galeria" class="modal-galeria">
        <span class="btn-cerrar" id="btn-cerrar">&times;</span>
        <button class="nav-btn btn-prev" id="btn-prev">&#10094;</button>
        
        <div class="modal-contenido">
            <img id="img-modal" src="" alt="Foto conejito">
            <div id="modal-contador" class="modal-contador">1 / 4</div>
        </div>

        <button class="nav-btn btn-next" id="btn-next">&#10095;</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
