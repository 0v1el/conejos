<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adopción de Conejitos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="banner-contenedor">
    <picture>
        <!-- Para celulares o de pantallas mass pequeñas (hasta 768px) -->
        <source media="(max-width: 768px)" srcset="imagenes/banner_de_cel_mejoradoyrecortado.png">
        
        <!-- imagen que deberia salir en dispositios mas grandes (pc/laptop) -->
        <img src="imagenes/banner_nuevo_pc_recortadoypequeño.png" alt="Promoción especial adopción de conejitos" class="banner-img">
    </picture>
    </header>

    <!-- Contenedor donde se insertarán las tarjetas -->
    <main id="tienda-contenedor" class="contenedor"></main>

    <!-- galería de fotos -->
    <div id="modal-galeria" class="modal-galeria">
        <span class="btn-cerrar" id="btn-cerrar">&times;</span>
        <button class="nav-btn btn-prev" id="btn-prev">&#10094;</button>
        
        <div class="modal-contenido">
            <img id="img-modal" src="" alt="Foto conejito">
            <div id="modal-contador" class="modal-contador">1 / 4</div>
        </div>

        <button class="nav-btn btn-next" id="btn-next">&#10095;</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
